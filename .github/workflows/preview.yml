name: PR preview

# Publishes each pull request to
# https://pof-ultrasound.github.io/pof-acoustics-website/pr-preview/pr-<n>/
# and comments the link on the PR. The preview is removed when the PR closes.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build
        if: github.event.action != 'closed'
        run: npm ci && npm run build
        env:
          SITE: https://pof-ultrasound.github.io
          BASE_PATH: /pof-acoustics-website/pr-preview/pr-${{ github.event.number }}/

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
